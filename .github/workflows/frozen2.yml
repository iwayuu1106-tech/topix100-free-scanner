name: FROZEN2 Backtest

# Triggered after the frozen spec and runner were committed separately.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "frozen2_pretest_1_0.json"
      - "backtest_frozen2.py"
      - ".github/workflows/frozen2.yml"
      - "universe.json"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  frozen2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest_frozen2.py
      - name: Commit FROZEN-2 outputs
        run: |
          git config user.name "topix100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/frozen2_pretest_1_0/
          git diff --cached --quiet || git commit -m "Add FROZEN-2 pretest results"
          git push
