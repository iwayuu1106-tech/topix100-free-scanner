name: V2 Research Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research_backtest_v2.py"
      - "research_holdout.py"
      - "validate_v2_hypothesis.py"
      - "run_formal_validation.py"
      - "universe.json"
      - "requirements.txt"
      - ".github/workflows/research.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python research_backtest_v2.py
      - run: python research_holdout.py
      - run: python run_formal_validation.py
      - name: Commit research outputs
        run: |
          git config user.name "topix100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/
          git diff --cached --quiet || git commit -m "Update v2 research backtest"
          git push
