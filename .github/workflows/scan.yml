name: Free TOPIX100 Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "15 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "universe.json"
      - "requirements.txt"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py --universe universe.json --outdir output
      - name: Commit scan outputs
        run: |
          git config user.name "topix100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Update TOPIX100 scan"
          git push
