name: Master Strategy Paper Scan

on:
  workflow_dispatch:
  schedule:
    # 16:10 JST = 07:10 UTC. Mon-Fri. Japanese holidays will simply reuse the latest completed bar.
    - cron: '10 7 * * 1-5'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python master_strategy_paper_scan.py
      - name: Commit paper scan output
        run: |
          git config user.name "topix100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper_master_strategy/
          git diff --cached --quiet || git commit -m "Update master strategy paper scan"
          git push
