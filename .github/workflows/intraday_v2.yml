name: Intraday V2 Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner_intraday_v2.py"
      - ".github/workflows/intraday_v2.yml"
      - "universe.json"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner_intraday_v2.py
      - name: Commit intraday outputs
        run: |
          git config user.name "topix100-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/intraday_v2_scan.csv output/intraday_v2_candidates.json
          git diff --cached --quiet || git commit -m "Update intraday v2 snapshot"
          git push
